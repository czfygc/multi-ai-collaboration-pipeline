# TITAN Multi-Review Dispatch — Reviewer Registry
#
# 模式切换（Step 4 双模式）：
#   MODE_A (role-based): 角色化分工 —— 适合架构/设计审阅
#       4 审阅者各司其职：Gemini=架构, DeepSeek=实现, Qwen=对抗, ChatGPT=架构师
#   MODE_B (code-scan): 代码扫描模式 —— 适合代码扫描/修复
#       8-9 模型并行扫描同一文件 → 各自找问题 → 去重合并 → 优先级排序 → 逐步修复验证
#
# 切换方式：orchestrate.mjs --mode role|scan
# 默认 MODE_A（角色化），兼容现有流程

# 角色分工（MODE_A 固定）：
#   Gemini / DeepSeek / Qwen   = Independent Reviewers，并行分发
#   ChatGPT                    = Research Architect，消费 delta.md
#
# 交付模式（delivery mode）由 orchestrate.mjs 的 --upload 标志决定：
#   inline（默认）— artifact 全文注入 prompt，适用于小报告（< 20K 字符）
#   upload        — 走文件上传通道，prompt 只写短指令，适用于代码/大文件
#
# 每个 reviewer 的 upload 字段：
#   upload_strategy          — "direct" | "menu_then_upload"
#   editor_selector          — 输入框选择器（注入短 prompt 用）
#   file_input_selector      — <input type="file"> 选择器
#   upload_button_selector   — menu_then_upload 时，先点击的按钮（direct 时为 null）
#   upload_menu_item_text    — menu_then_upload 时，菜单项按文本匹配
#   upload_wait_ms           — 上传后等待毫秒数（保守值）

# ============ MODE_A: 角色化审阅者（4席）===========
reviewers_role:
  - name: gemini
    display_name: "Gemini"
    url_match: "gemini\\.google\\.com"
    url_open: "https://gemini.google.com/app"
    perspective: "架构与接口契约"
    perspective_prompt: |
      请从【架构与接口契约】角度审阅这段代码：模块边界是否清晰、
      函数契约是否自洽、依赖方向是否单向、跨模块耦合是否最小、
      抽象层级是否一致、是否存在泄漏的抽象。
    prefix: "G"
    # 2026-11-14：恢复可用接入；前提为 CDP 浏览器出口 JP/TW/KR/SG 非香港且账号可用。
    # 选择器做多兜底（Gemini DOM/语言易变）。
    enabled: true
    editor_selector: 'rich-textarea .ql-editor[contenteditable="true"], .ql-editor[contenteditable="true"], div[contenteditable="true"][aria-label*="Gemini"], div[contenteditable="true"][aria-label*="prompt"], [role="textbox"][contenteditable="true"]'
    submit_selector: 'button[aria-label*="Send"], button[aria-label*="发送"], button.send-button, button[mattooltip*="Send"], button[data-test-id="send-button"]'
    editor_kind: "contenteditable"
    # T-394 A3 (2026-11-16): 与 qwen 同口径，避免 Gemini 思考 >60s 触发 waitComplete 默认 fast_fail 误杀
    fast_fail_ms: 120000
    required_stable: 12
    poll_interval_ms: 150
    response_selector: 'model-response, message-content .model-response-text, .model-response-text, message-content, .response-container-content'
    generating_selector: 'button[aria-label*="Stop"], button[aria-label*="停止"]'
    upload_strategy: "direct"
    skip_fresh_chat: false
    file_input_selector: 'input[type="file"]'
    upload_button_selector: 'button[aria-label*="Upload"], button[aria-label*="上传"], button[aria-label*="Add"]'
    upload_menu_item_text: "从设备上传"
    upload_wait_ms: 3000

  - name: deepseek
    display_name: "DeepSeek"
    url_match: "chat\\.deepseek\\.com"
    url_open: "https://chat.deepseek.com/"
    perspective: "正确性与实现细节"
    perspective_prompt: |
      请从【正确性与实现细节】角度审阅这段代码：逻辑分支是否覆盖、
      边界条件是否遗漏、变量作用域/类型/生命周期是否正确、
      异常路径是否处理、异步/并发是否安全、是否存在未声明的假设。
    prefix: "D"
    enabled: true
    # T-62 补（2026-10-14 实测）：deepseek 新 UI 用 .ds-markdown 渲染消息（108 命中），
    # model-response/.markdown 等默认选择器全部 0 —— 不配则 lastText 通道全瞎，
    # 提前返回判 false 空转到超时天花板并触发 regen 重复发送（用户实测两遍同答）。
    response_selector: "div.ds-markdown.ds-assistant-message-main-content"
    editor_selector: 'textarea[placeholder="Message DeepSeek"]'
    submit_selector: '[role="button"].ds-button--circle.ds-button--primary'
    editor_kind: "textarea"
    generating_selector: null
    upload_strategy: "direct"
    file_input_selector: 'input[type="file"]'
    upload_button_selector: null
    upload_menu_item_text: null
    upload_wait_ms: 3000
    response_max_ms: 600000

  - name: qwen
    display_name: "Qwen"
    url_match: "chat[.]qwen[.]ai"
    url_open: "https://chat.qwen.ai/"
    perspective: "对抗性与失效模式"
    perspective_prompt: |
      请从【对抗性与失效模式】角度审阅这段代码：主动构造反例、
      寻找可被外部触发或误用的路径、压力测试隐含假设、
      指出隐蔽的状态泄漏或资源泄漏、挑战"正常路径"以外的场景。
    prefix: "Q"
    # 2026-10-14 服务器宕机由 grok 顶班；2026-10-16 恢复复席实探（用户证实五席全在）：
    # 登录✓ editor✓（textarea.message-input-textarea）/ 发送键 button.send-button（输入后出现；
    # 空闲态该槽位为 voice-input-button——勿据此误判选择器失效）——原选择器无需改，直接复启用。
    enabled: true
    editor_selector: 'textarea.message-input-textarea'
    submit_selector: 'button.send-button'
    editor_kind: "textarea"
    generating_selector: null
    # T-394 A1 (2026-11-16): seat-exec/runSeat need these fields; qwen section previously lacked them ->
    # waitComplete fell back to the DeepSeek default selector -> zero matches on chat.qwen.ai ->
    # elsLen stuck at 0, sawNew stuck at false -> 120s FAIL_FAST misfire. Selectors per QWEN_SEAT (adapters/web-seat.mjs, T-253 verified).
    response_selector: 'div.response-message-content'
    busy_selector: 'button.stop-button'
    response_aggregate: true
    required_stable: 40
    poll_interval_ms: 150
    fast_fail_ms: 120000  # T-390 Step B: Qwen 首 token 可能 >60s（实测 bubble 在 60s 后才出现），fast-fail 前移 120s
    # T-208 1.9：drag → direct（截图坐标拖拽是 T-158 八连败根因；DOM.setFileInputFiles 直传待 1.11c 实测）
    upload_strategy: "direct"
    file_input_selector: 'input[type="file"]'
    upload_button_selector: null
    upload_menu_item_text: null
    upload_wait_ms: 3000

  - name: grok
    display_name: "Grok"
    url_match: "grok\\.com|x\\.com/i/grok"
    url_open: "https://grok.com/"
    perspective: "对抗性与失效模式"
    perspective_prompt: |
      请从【对抗性与失效模式】角度审阅这段代码：主动构造反例、
      寻找可被外部触发或误用的路径、压力测试隐含假设、
      指出隐蔽的状态泄漏或资源泄漏、挑战"正常路径"以外的场景。
    prefix: "K"
    # 2026-10-14 qwen 服务器宕机换回备胎（用户指令"不等 qwen"）；实探定配：
    # 编辑器=div.tiptap.ProseMirror（落地页 role=combobox/对话页 role=textbox——用 role 无关选择器，
    # editor_selector 兼注入复检与拖拽兜底）；发送键=button[aria-label="Submit"]（旧 *Send 已失效）；
    # 回复容器 assistant 专属=.message-bubble.rounded-3xl（用户气泡无 rounded-3xl，实探 4:3 交替验证）；
    # 文件键 input[type="file"].hidden 命中 ✓。qwen 恢复后重新探测定配再切回。
    enabled: true
    editor_selector: 'div.tiptap.ProseMirror'
    submit_selector: 'button[aria-label="Submit"]'
    editor_kind: "contenteditable"
    generating_selector: null
    response_selector: '.message-bubble.rounded-3xl'
    upload_strategy: "direct"
    file_input_selector: 'input[type="file"].hidden'
    upload_button_selector: null
    upload_menu_item_text: null
    upload_wait_ms: 3000

  - name: chatgpt
    display_name: "ChatGPT"
    url_match: "chatgpt\\.com"
    url_open: "https://chatgpt.com/"
    perspective: "咨询席——任务咨询与意见回复（仅回文本意见，不做架构裁决，不发附件，不占配额）"
    perspective_prompt: |
      请作为咨询席，针对以下任务给出简明意见与建议：仅回文字面咨询意见，不做架构裁决，不处理附件。
    prefix: "C"
    enabled: true
    editor_selector: '[contenteditable="true"].ProseMirror'
    # T-20261111 复盘：chatgpt.com 新版 composer——空态不渲染发送按钮；composer 非空时出现
    # `button[type="submit"][aria-label="Send"]`（英文）/ `button[aria-label="发送"]`（中文）；点击即发送+编辑器清空（已实测）。
    # 旧行为：send_mode=enter 假成功（编辑器残留未发送、waitGeneric 抓到别的回复）——Enter 路径废弃。
    submit_selector: 'button[aria-label="Send"], button[aria-label="发送"], button[type="submit"][aria-label="Send"], button[type="submit"][aria-label="发送"]'
    editor_kind: "contenteditable"
    generating_selector: 'button[aria-label="Stop"], button[aria-label="停止"]'
    send_mode: "click"  # T-390 Step C 曾判 enter；2026-11-17 实测 enter 也静默失败（enter_not_cleared，消息零送达）→ 回到 click（waitForSubmitReady+编辑器清空双重校验）
    response_selector: '[data-content-search-unit-key$=":assistant"] [class*="--entity-prose-inset"]'
    upload_strategy: "direct"
    file_input_selector: 'input[type="file"]'
    upload_button_selector: null
    upload_menu_item_text: null
    upload_wait_ms: 3000
    role: consultant
    # T-395 (2026-11-16): chatgpt 在「只输出 JSON」指令下稳定吐裸 JSON 动作（T-394 A2 实测）；
    # action_only=true 时整条回复 trim 后恰为单个 JSON 对象且通过 allowlist+schema 校验才执行；
    # URL 字符串解包 [text](url) -> url；标签路径不受影响；闸/围栏不变。
    action_only: true

  # 2026-11-15 T-386：Muse 席上岗（与本地席同级，能力见 SEAT_CAPABILITIES.muse）。
  # 选择器与 orchestrator/adapters/web-seat.mjs 的 MUSE_SEAT 常量同源（T-366/T-368 实测），勿单独漂移。
  - name: muse
    display_name: "Muse"
    url_match: "muse\\.ai"
    url_open: "https://muse.ai/"
    perspective: "通用协作席——读代码/改代码/跑测试（2026-11-15 T-386 上岗，本地席同级）"
    perspective_prompt: |
      请按任务要求独立执行：读代码、改代码、跑测试，最后给出结论。
    prefix: "M"
    enabled: true
    editor_selector: 'textarea[aria-label="Message"], textarea[aria-label="消息"], textarea[aria-label="信息"], textarea[placeholder="Message"], textarea[placeholder="消息"]'
    editor_kind: "textarea"
    submit_selector: 'button[aria-label="Send"], button[aria-label="发送"]'
    send_mode: "click"
    response_selector: '[data-message-role="assistant"]'
    response_aggregate: true
    required_stable: 20
    poll_interval_ms: 150
    generating_selector: 'button[aria-label="Stop"], button[aria-label="停止"]'
    busy_selector: 'button[aria-label="Stop"], button[aria-label="停止"]'
    response_max_ms: 900000
    upload_strategy: "direct"
    file_input_selector: 'input[type="file"].sr-only'
    upload_button_selector: null
    upload_menu_item_text: null
    upload_wait_ms: 3000
    history_user_selector: '[data-message-role="user"]'
    history_assistant_selector: '[data-message-role="assistant"]'

# ============ MODE_B: 代码扫描模式（8-9 模型并行扫描）===========
