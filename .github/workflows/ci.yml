name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ISSUE_REGISTRY JSON 校验
        # T-250：台账按 M8 永不发布 → 公开仓干净检出没有 ISSUE_REGISTRY.json，
        # 无台账可校时跳过本步（本地 pre-commit 钩子的 fail-closed 不受影响）。
        if: hashFiles('ISSUE_REGISTRY.json') != ''
        run: node orchestrator/pre-commit-check.mjs

      - name: Skill quality gate (T-155)
        run: node orchestrator/skill-quality.mjs --strict

      # T-250：verify-gate 与 Gate tests 已移出公开 CI。二者是「完整工作区闸」——
      # 依赖未发布的全仓闭包（lib/exec-*、shell/titan-shell、js-yaml node_modules、
      # tmp 夹具、docs 图等）与 WIP 文件（web-seat），在发布树子集上必挂（2026-10-31
      # 干净克隆实测 22/328 失败）。其职责由本地 pre-commit 钩子（T-204 已装）+ 四端
      # M4 自检承担；公开面由上方 registry 守卫、skill-quality、交付闸、gitleaks 把关。

      - name: Delivery gates (T-175)
        # 交付闸：第三方署名必须 PASS（显式未知不当通过）；产物/发布段在仓库本体上未判 = UNKNOWN
        run: |
          node orchestrator/artifact-gate.mjs license --root .
          node orchestrator/artifact-gate.mjs stage-gate --root . --code PASS || true

      - name: Secret scan (gitleaks, fail on match)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE_KEY: ${{ secrets.GITLEAKS_LICENSE_KEY }}
